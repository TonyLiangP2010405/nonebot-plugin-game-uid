[project]
name = "nonebot-plugin-game-uid"
version = "0.2.0"
description = "记录、汇总和定时播报群友的星布谷地、原神、崩坏：星穹铁道与绝区零 UID"
authors = [{ name = "TonyLiangP2010405" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.9,<4.0"
keywords = ["nonebot", "nonebot2", "uid", "mihoyo", "onebot"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Chat",
]
dependencies = [
    "nonebot2>=2.2.0",
    "nonebot-adapter-onebot>=2.4.0",
    "nonebot-plugin-apscheduler>=0.5.0",
    "nonebot-plugin-localstore>=0.7.0",
    "aiosqlite>=0.19.0",
]

[project.urls]
Homepage = "https://github.com/TonyLiangP2010405/nonebot-plugin-game-uid"
Repository = "https://github.com/TonyLiangP2010405/nonebot-plugin-game-uid"

[tool.poetry]
packages = [{ include = "nonebot_plugin_game_uid" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0"
pytest-asyncio = ">=0.21"
nonebug = ">=0.3"
ruff = ">=0.1"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.nonebot]
plugins = ["nonebot_plugin_game_uid"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "UP007", "UP045"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
